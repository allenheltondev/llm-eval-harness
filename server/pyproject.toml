[project]
name = "llm-eval-harness-server"
version = "0.1.0"
description = "LLM Eval Harness server - execution/eval engine for the model-evaluation harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "strands-agents[anthropic,ollama,openai]>=0.1.0",
    "strands-agents-evals>=0.1.0",
    "boto3>=1.34",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20",
    "pyjwt[crypto]>=2.8",
]

# The CLI is the primary entry point (docs/cli.md); the HTTP API is one of the
# things it can start. argparse-only on purpose: a click/typer dependency would
# ride into the Lambda artifact, which has a 250 MB ceiling it is already
# pruning to stay under, in exchange for nothing this parser cannot do.
[project.scripts]
evalharness = "evalharness.cli.main:main"

[dependency-groups]
dev = [
    "mutmut>=3.7.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evalharness"]

[tool.ruff]
line-length = 100
target-version = "py312"
# mutmut's mutation sandbox (see [tool.mutmut] below): a disposable copy of the
# source tree, littered with generated `_mutmut_N` variants of every mutated
# function. Not source we own or want linted.
extend-exclude = ["mutants"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's `Depends(...)` in argument defaults is the idiomatic pattern.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Coverage is opt-in via the CLI (`uv run pytest --cov=evalharness ...`), not
# wired into addopts here, so a plain `uv run pytest` during local dev stays at
# its normal (faster) speed. CI's coverage step passes --cov explicitly; see
# docs/testing.md / the CI workflow for the exact invocation.
[tool.coverage.run]
source = ["evalharness"]

[tool.coverage.report]
# Ratchet, not a target: set to the actual post-gap-fill percentage (98.6%),
# rounded down. Bump it only when real coverage climbs past the next percent
# point -- never round up speculatively.
fail_under = 98
exclude_also = [
    # Type-checking-only branches never execute at runtime.
    "if TYPE_CHECKING:",
    # An abstract/unsupported-by-design method body; the interesting behavior
    # is that it raises, which is what a caller-side test (if any) covers.
    "raise NotImplementedError",
    # The AgentCore SDK bootstrap in evalharness/worker/agentcore_app.py
    # (module-level `app = BedrockAgentCoreApp()` / `@app.entrypoint` wiring
    # and the `if __name__ == "__main__":` boot path) cannot run without the
    # optional `worker` extra installed *and* a real AgentCore Runtime
    # container -- evalharness.worker.agentcore_app imports cleanly without
    # either, and `dispatch`/`execute` (everything actually worth testing) are
    # exercised directly. That block is marked inline with the standard
    # `# pragma: no cover` comment (already covered by coverage.py's default
    # exclude pattern) rather than duplicated as a regex here, since the
    # existing per-line pragma *is* the general-purpose mechanism, not a
    # one-off exception to it.
]

# Mutation testing, scoped to the pure-logic core (installed: mutmut 3.7.0).
#
# mutmut 3.x renamed the config keys the task brief described for older
# releases: `paths_to_mutate` -> `source_paths` (still accepted but warns) and
# `tests_dir` -> `pytest_add_cli_args_test_selection`. `source_paths` must be a
# walkable *directory* (mutmut os.walks it to build the sandboxed `mutants/`
# copy), so the actual file-level scoping happens through `only_mutate` glob
# patterns -- the modern equivalent of listing individual files.
#
# Every file below is business logic with no boto3/AWS/network call in it
# (translation, parsing, cursor math, event rendering) so a surviving mutant is
# informative rather than "the mock didn't notice". `configstore/client.py` went
# with the config store; `cli/render.py` took its place, keeping the list at
# nine files.
#
# Measured on that list: 2507 mutants, 2092 killed, 415 survived (83%), ~4
# minutes end to end at ~12 mutations/second. Survivor counts move by one or
# two between runs, so treat them as approximate. Where they sit is the useful
# part: worker/ddb.py (118), guardrails/translator.py (100) and engine/mapper.py
# (84) carry most of them and are where the next round of test work pays off.
[tool.mutmut]
source_paths = ["evalharness"]
only_mutate = [
    "evalharness/evals/metrics.py",
    "evalharness/evals/rubrics.py",
    "evalharness/engine/mapper.py",
    "evalharness/engine/events.py",
    "evalharness/store/history.py",
    "evalharness/worker/ddb.py",
    "evalharness/guardrails/translator.py",
    "evalharness/models_catalog.py",
    "evalharness/cli/render.py",
]
pytest_add_cli_args_test_selection = ["tests/"]
