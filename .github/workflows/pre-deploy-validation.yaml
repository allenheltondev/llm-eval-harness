name: Pre-deployment validations

# The gates in front of every deploy, one job per package so they run in
# parallel and the caller can skip the ones its change set does not touch.
# Coverage thresholds are ratchets set at achieved numbers (server
# pyproject.toml fail_under, app vitest.config.ts thresholds); never lower them.

on:
  workflow_call:
    inputs:
      run_app:
        required: false
        type: boolean
        default: true
      run_server:
        required: false
        type: boolean
        default: true
      run_infra:
        required: false
        type: boolean
        default: true
      run_e2e:
        required: false
        type: boolean
        default: true

jobs:
  app:
    name: App
    if: inputs.run_app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  server:
    name: Server
    if: inputs.run_server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run pytest --cov=nimbus --cov-report=term-missing

  infra:
    name: Template
    if: inputs.run_infra
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
      # cfn-lint via `sam validate --lint`; no AWS credentials needed.
      - run: make validate-template

  e2e:
    name: E2E
    if: inputs.run_e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev
        working-directory: server
      - run: npm ci
        working-directory: app
      - run: npx playwright install --with-deps chromium
        working-directory: app
      # No PLAYWRIGHT_BROWSERS_PATH here on purpose: a `~` in a YAML env value
      # is NOT shell-expanded -- it resolved to a literal ./~/.cache directory
      # once and every spec failed with "Executable doesn't exist".
      - run: npx playwright test
        working-directory: app
