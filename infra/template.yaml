AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Nimbus -- DynamoDB history/eval-state table, the Lambda eval worker,
  the FastAPI server on Lambda (Web Adapter + Function URL), SPA hosting on S3 + CloudFront,
  and a Cognito user pool that gates the deployed app.

Parameters:
  # --------------------------------------------------------------------------
  # Cloud evaluation lane (see docs/cloud-evals.md + docs/cloud-evals-infra.md)
  # --------------------------------------------------------------------------
  EvalWorkerArtifactKey:
    Type: String
    Default: ''
    Description: >
      S3 key (within ArtifactBucket) of the eval worker's CodeZip
      artifact. Empty (the default) means the worker is not deployed and the
      cloud lane stays unavailable -- the rest of the stack is unaffected.

      The key MUST change whenever the artifact changes: Lambda reads the zip
      at create/update time, and CloudFormation only rolls the runtime when a
      property it can see has changed. A static key means a stale bundle keeps
      serving forever. `scripts/package-eval-worker.sh` therefore emits a
      content-hash-versioned key (eval-worker/<sha256>.zip) and `make
      deploy-backend` passes it through.

      CAUTION: this is a plain parameter with an empty default, so running a
      bare `sam deploy` after the worker exists resets it to '' and DELETES the
      runtime. Always deploy through `make deploy-backend`, which passes both
      artifact keys every time.

  # --------------------------------------------------------------------------
  # Deployed FastAPI server + SPA hosting (see docs/serverless-deploy.md and
  # docs/serverless-deploy-infra.md)
  # --------------------------------------------------------------------------
  ServerArtifactKey:
    Type: String
    Default: ''
    Description: >
      S3 key (within ArtifactBucket, which doubles as this stack's
      artifact bucket) of the FastAPI server's Lambda zip. Empty (the default)
      means the server is not deployed -- no Lambda, no bucket, no CloudFront --
      and the rest of the stack deploys exactly as it did before.

      Same content-hash rule and same footgun as EvalWorkerArtifactKey above:
      the key MUST change whenever the code changes, or CloudFormation sees no
      property change and the old bundle keeps serving.
      `scripts/package-server.sh` emits server/<sha256>.zip and `make
      deploy-backend` passes it through alongside EvalWorkerArtifactKey.

      CAUTION: a bare `sam deploy` after the server exists resets this to ''
      and DELETES the function, bucket and distribution. Use `make
      deploy-backend`.

  HistoryRetentionDays:
    Type: Number
    Default: 0
    MinValue: 0
    Description: >
      How many days deployed history -- evaluations, their results and their
      runs -- is kept before DynamoDB expires it. 0 (the default) keeps it
      forever. An evaluation's progress events and cancel flag are a replay
      log, not history, and expire after 90 days (or with the evaluation, if
      sooner) either way. Changing this applies to items as they are written:
      a finished evaluation keeps the expiry it was stored with.

  ServerMemorySize:
    Type: Number
    Default: 1024
    MinValue: 512
    MaxValue: 10240
    Description: >
      Memory (MB) for the server Lambda. Lambda scales CPU with memory, and the
      cold start pays for importing strands + boto3 + FastAPI, so this is a
      latency knob as much as a memory one.

  EvalWorkerMemorySize:
    Type: Number
    Default: 1024
    MinValue: 512
    MaxValue: 10240
    Description: >
      Memory (MB) for the evaluation worker Lambda. The work is mostly waiting
      on Bedrock rather than computing, so this is about headroom for three
      concurrent runs plus the judge -- and, since Lambda scales CPU with
      memory, about how fast the cold start imports strands + boto3.

  ServerFunctionUrlAuthType:
    Type: String
    Default: NONE
    AllowedValues: [NONE, AWS_IAM]
    Description: >
      Function URL auth. NONE: the URL is public-but-unguessable, the real
      front door is CloudFront, and the application itself is the gate -- the
      server requires a Cognito bearer token (UserPool below) on every route
      but /health (docs/serverless-deploy.md "Auth").
      AWS_IAM is wired here for later, but note it is NOT a drop-in with
      CloudFront: origin access control for Lambda function URLs requires the
      *viewer* to send an x-amz-content-sha256 body hash on POST/PUT, which a
      browser cannot do. AWS_IAM is only usable today for SigV4-signing
      non-browser clients calling the Function URL directly.

  ServerCorsOrigins:
    Type: String
    Default: '[]'
    Description: >
      JSON array for NIMBUS_CORS_ORIGINS. Default is the empty list: the
      SPA and the API share one CloudFront origin, so the browser never makes a
      cross-origin request and no Access-Control-Allow-Origin is needed. An
      empty list is therefore the tightest correct value -- it also means a page
      on some other site that guesses the Function URL gets no CORS grant.
      Set e.g. '["http://localhost:3000"]' to point a local vite at the
      deployed server.

  LambdaAdapterLayerVersion:
    Type: Number
    Default: 28
    Description: >
      Version of the public AWS Lambda Web Adapter layer (account
      753240598075, published into every commercial region). Bump to pick up a
      newer adapter. See https://github.com/aws/aws-lambda-web-adapter.

  LambdaAdapterLayerArn:
    Type: String
    Default: ''
    Description: >
      Full override for the adapter layer ARN. Empty (the default) builds
      arn:<partition>:lambda:<region>:753240598075:layer:LambdaAdapterLayerArm64:<LambdaAdapterLayerVersion>.
      Set this only for a partition or private mirror where that account does
      not publish.

Conditions:
  # The worker is opt-in. Everything below is skipped entirely until an artifact
  # key is supplied, so the rest of the stack deploys exactly as it did before.
  DeployEvalWorker: !Not [!Equals [!Ref EvalWorkerArtifactKey, '']]
  # So is the server + SPA hosting, on exactly the same pattern.
  DeployServer: !Not [!Equals [!Ref ServerArtifactKey, '']]
  # Only when BOTH halves are deployed does the server get a cloud eval lane.
  ServerHasEvalWorker: !And
    - !Condition DeployServer
    - !Condition DeployEvalWorker
  UseDefaultAdapterLayer: !Equals [!Ref LambdaAdapterLayerArn, '']
  # The Function URL's resource policy. See ServerFunctionUrlPublicPermission
  # for why this is ours to declare rather than SAM's to emit.
  ServerFunctionUrlIsPublic: !And
    - !Condition DeployServer
    - !Equals [!Ref ServerFunctionUrlAuthType, 'NONE']

Resources:
  # One single-table store: RUN#/EVAL# items written by the server (deployed
  # history) and the eval worker (cloud-lane state), read back through GSI1.
  # Item shapes are the contract in docs/cloud-evals.md.
  EvalTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          # Superseded artifacts are dead weight: each deploy uploads a new
          # content-hashed key and the runtime only ever reads the current one.
          - Id: ExpireOldArtifacts
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30
  EvalWorkerFunction:
    Type: AWS::Serverless::Function
    Condition: DeployEvalWorker
    Metadata:
      # Same story as ServerFunction: the zip is prebuilt with cross-compiled
      # arm64 wheels by scripts/package-eval-worker.sh and uploaded under a
      # content-hashed key, so there is nothing for `sam build` to do.
      SkipBuild: true
    Properties:
      CodeUri:
        Bucket: !Ref ArtifactBucket
        Key: !Ref EvalWorkerArtifactKey
      # The worker zip still carries the pre-rename evalharness.worker.lambda_app
      # shim for this one deploy: CloudFormation applies configuration and code
      # in separate calls, so if the new code lands before this handler, the
      # old handler name must still resolve. Drop the shim in the next release
      # (docs/serverless-deploy.md).
      Handler: nimbus.worker.lambda_app.handler
      Runtime: python3.12
      Architectures:
        - arm64
      Tracing: Active
      # An evaluation executes up to 25 runs at a concurrency of 3 and then
      # grades them, all in one invocation. Memory is also CPU on Lambda, and
      # this workload is mostly waiting on Bedrock, so the size is about having
      # enough headroom for the concurrent HTTP work rather than compute.
      MemorySize: !Ref EvalWorkerMemorySize
      # Lambda's hard ceiling. nimbus.worker.lambda_app stops the
      # evaluation cooperatively before this, at a run boundary, so a job that
      # runs long settles as `deadline_exceeded` with its finished runs intact
      # instead of being killed mid-write and left reading `running` forever.
      Timeout: 900
      EventInvokeConfig:
        # Retries are ON, and they are safe because of the ownership claim.
        #
        # The handler's conditional pending -> running update is a claim that
        # exactly one delivery can win (DynamoEvalStore.mark_running). So a
        # redelivery of an evaluation that was already claimed -- after a
        # crash, a timeout, or Lambda's own at-least-once duplicates -- runs
        # nothing. That removes what used to make retries dangerous here: a
        # second 15-minute run over the first attempt's state.
        #
        # What retries buy is the one case with no other recovery: a failure
        # *before* the claim (DynamoDB throttled or unreachable as the worker
        # starts). The server has already written the `pending` row by then,
        # and the handler raises rather than returning, so Lambda redelivers
        # and the retry claims the row and runs it. Without this, that row
        # would read `pending` forever.
        MaximumRetryAttempts: 2
      Environment:
        Variables:
          # Worker-owned (docs/cloud-evals.md "Configuration").
          TABLE_NAME: !Ref EvalTable
          # Consumed by nimbus.config.Settings (NIMBUS_ prefix), which
          # evals.engine.default_deps() builds from the environment because the
          # worker has no FastAPI request to hang dependencies off.
          NIMBUS_AWS_REGION: !Ref AWS::Region
          # /var/task is read-only; /tmp is not. The run engine's SQLite
          # scratch is per invocation (lambda_app.scratch_database, under
          # /tmp/nimbus-worker/, wiped at the start and end of each one),
          # so this is only the fallback for anything touching the engine
          # outside that scope -- it must still be writable.
          NIMBUS_DB_PATH: /tmp/nimbus-worker.db
          # Setting the path is NOT enough to select SQLite, and getting this
          # wrong costs the whole evaluation. `history_backend` defaults to
          # `auto`, and `auto` resolves by looking for AWS_LAMBDA_FUNCTION_NAME
          # -- which Lambda sets, and AgentCore did not. So the same env that
          # resolved to SQLite on the old host resolves to DynamoDB here, and
          # since the worker deliberately has no NIMBUS_EVAL_TABLE,
          # get_history_repo() raises HistoryBackendMisconfiguredError before
          # the first run starts. Pin it.
          #
          # SQLite is right for the worker: the run engine writes each run to
          # this scratch database and DynamoEvalStore.save_run then copies the
          # row into a RUN# item, which is what makes it durable and readable
          # from another machine. The worker's own DynamoDB writes go through
          # that store, not through the history repo.
          NIMBUS_HISTORY_BACKEND: sqlite
          # Read by worker.lambda_app.build_store for the evaluation and run
          # items it writes -- the same rule the server applies to its own.
          NIMBUS_HISTORY_RETENTION_DAYS: !Ref HistoryRetentionDays
      Policies:
        - Version: 2012-10-17
          Statement:
            # The evaluation itself: the model under test, plus the judge.
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
                - bedrock:Converse
                - bedrock:ConverseStream
              Resource:
                - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/*
                - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*
            # Guardrail-backed runs evaluate the configured guardrail inline.
            - Effect: Allow
              Action: bedrock:ApplyGuardrail
              Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/*
            # Job state: EVAL# meta/events, the CANCEL flag, RUN# records.
            # No Scan and no Query -- the worker only ever touches items whose
            # keys it already knows.
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt EvalTable.Arn
  ServerFunction:
    Type: AWS::Serverless::Function
    Condition: DeployServer
    Metadata:
      # The zip is prebuilt by scripts/package-server.sh (cross-compiled arm64
      # wheels) and uploaded under a content-hashed key. There is nothing for
      # `sam build` to do, and every Python build workflow it might try to
      # infer would be wrong.
      SkipBuild: true
    Properties:
      CodeUri:
        Bucket: !Ref ArtifactBucket
        Key: !Ref ServerArtifactKey
      # `run.sh` at the root of the zip, exec'd by the adapter's bootstrap.
      Handler: run.sh
      Runtime: python3.12
      # arm64 to match the cross-compiled wheels scripts/package-server.sh builds.
      Architectures:
        - arm64
      Tracing: Active
      MemorySize: !Ref ServerMemorySize
      # A streaming run must finish inside one invocation; 900s is Lambda's max.
      Timeout: 900
      Layers:
        - !If
          - UseDefaultAdapterLayer
          - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerArm64:${LambdaAdapterLayerVersion}
          - !Ref LambdaAdapterLayerArn
      Environment:
        Variables:
          # -- Lambda Web Adapter ------------------------------------------- #
          # Makes Lambda exec the layer's bootstrap, which in turn execs Handler.
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          AWS_LWA_INVOKE_MODE: response_stream
          PORT: 8080
          # Readiness is deliberately left at the adapter's default path ("/")
          # with its default healthy range (100-499): FastAPI answers 404 there
          # the instant the ASGI app is serving, which is exactly the signal
          # wanted. Pointing it at /api/v1/health instead would make every cold
          # start pay for a provider probe first.
          #
          # -- application --------------------------------------------------- #
          NIMBUS_AWS_REGION: !Ref AWS::Region
          # /var/task is read-only. The run engine still opens a SQLite file for
          # scratch even when history lives in DynamoDB, so give it /tmp.
          NIMBUS_DB_PATH: /tmp/nimbus.db
          # Deployed shape (docs/serverless-deploy.md): DynamoDB history, cloud
          # lane only. Both are explicit rather than left to `auto` so the
          # behaviour does not silently depend on Lambda env-var detection.
          NIMBUS_HISTORY_BACKEND: dynamodb
          NIMBUS_LOCAL_EVALS: 'off'
          NIMBUS_EVAL_TABLE: !Ref EvalTable
          NIMBUS_HISTORY_RETENTION_DAYS: !Ref HistoryRetentionDays
          NIMBUS_EVAL_FUNCTION_NAME: !If
            - ServerHasEvalWorker
            - !Ref EvalWorkerFunction
            - !Ref AWS::NoValue
          # Empty by default: SPA and API share one CloudFront origin, so
          # nothing the browser does is cross-origin. See the parameter.
          NIMBUS_CORS_ORIGINS: !Ref ServerCorsOrigins
          # -- authentication (nimbus.auth) --------------------------------- #
          # Both set => every route but /health demands a bearer token minted
          # by this pool for this client. This is THE gate: the Function URL
          # and CloudFront are both open doors (see the UserPool comment).
          NIMBUS_AUTH_USER_POOL_ID: !Ref UserPool
          NIMBUS_AUTH_CLIENT_ID: !Ref UserPoolClient
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: 2012-10-17
          Statement:
            # The run engine and the judge.
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
                - bedrock:Converse
                - bedrock:ConverseStream
              Resource:
                - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/*
                - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*
            # GET /api/v1/models -- nimbus.awscat.catalog.
            - Effect: Allow
              Action:
                - bedrock:ListFoundationModels
                - bedrock:ListInferenceProfiles
              Resource: '*'
            # The guardrails router is full CRUD (nimbus/guardrails/service.py),
            # unlike the worker, which only applies them.
            - Effect: Allow
              Action:
                - bedrock:ApplyGuardrail
                - bedrock:CreateGuardrail
                - bedrock:CreateGuardrailVersion
                - bedrock:GetGuardrail
                - bedrock:UpdateGuardrail
                - bedrock:DeleteGuardrail
              Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/*
            - Effect: Allow
              Action: bedrock:ListGuardrails
              Resource: '*'
            # History + cloud-eval reads. Unlike the worker this side DOES
            # query: listing runs/evaluations walks the GSI1 RUN/EVAL
            # partitions, and DELETE /runs/{id} is a real endpoint.
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
              Resource: !GetAtt EvalTable.Arn
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub ${EvalTable.Arn}/index/GSI1
            # Dispatching an evaluation to the cloud lane.
            - !If
              - ServerHasEvalWorker
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt EvalWorkerFunction.Arn
              - !Ref AWS::NoValue
      FunctionUrlConfig:
        # v1: public-but-unguessable, fronted by CloudFront. The matching
        # resource policy is ServerFunctionUrlPublicPermission below -- SAM
        # does NOT emit it for us here.
        AuthType: !Ref ServerFunctionUrlAuthType
        InvokeMode: RESPONSE_STREAM

  # A Function URL with AuthType NONE is still closed until a resource policy
  # opens it: without `lambda:InvokeFunctionUrl` for Principal "*" every
  # request gets 403 "Forbidden. For troubleshooting Function URL
  # authorization issues ...", which is what CloudFront then serves for the
  # whole API.
  #
  # SAM normally emits this permission itself, and that is why the comment
  # above used to say so -- but it only does it when AuthType is the *literal*
  # string NONE. Its check is `auth_type not in ["NONE"]`
  # (samtranslator/model/sam_resources.py, _construct_url_permission), and
  # AuthType here is `!Ref ServerFunctionUrlAuthType`, an unresolved intrinsic
  # at transform time. So the dict never equals "NONE", the permission is
  # silently skipped, and the stack deploys clean with an unreachable server.
  # Parameterising AuthType is what dropped it. `sam validate --lint` cannot
  # see this, because the resource that is missing is one the transform
  # declined to add.
  #
  # Declared explicitly, so it follows the parameter instead of the literal:
  # present when the URL is public, absent when it is AWS_IAM (where the
  # caller's own SigV4 identity is the grant and a public policy would undo
  # the point of switching).
  ServerFunctionUrlPublicPermission:
    Type: AWS::Lambda::Permission
    Condition: ServerFunctionUrlIsPublic
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !GetAtt ServerFunction.Arn
      Principal: '*'
      FunctionUrlAuthType: NONE

  # The second half of what a literal AuthType: NONE gets you. Not strictly
  # broader than the grant above -- InvokedViaFunctionUrl restricts it to calls
  # arriving through the Function URL, which is the same reachability
  # lambda:InvokeFunctionUrl already allows. Included so this pair is exactly
  # what SAM emits for a public URL rather than one permission short of it,
  # which is the whole class of bug being fixed here.
  ServerFunctionUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: ServerFunctionUrlIsPublic
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt ServerFunction.Arn
      Principal: '*'
      InvokedViaFunctionUrl: true

  # ---------------------------------------------------------------------------
  # Authentication: a Cognito user pool + app client, verified by the server.
  #
  # The Function URL stays AuthType NONE and CloudFront stays open, because
  # neither can be closed for a browser that POSTs (CloudFront OAC for
  # function URLs needs the viewer to send an x-amz-content-sha256 body hash
  # -- docs/serverless-deploy-infra.md "Auth"). So the gate is the application
  # itself: nimbus.auth verifies `Authorization: Bearer <id token>` on
  # every route but /health, identically through both doors.
  #
  # Same shape as readysetcloud/rsc-core: email usernames, USER_PASSWORD_AUTH
  # (the SPA calls cognito-idp directly, no Hosted UI, no SDK), refresh tokens.
  # Deliberate differences: no self sign-up (an account here can spend the AWS
  # bill, so the operator creates users -- `make create-user`), and no OAuth /
  # hosted domain (nothing uses it).
  #
  # Both resources are named explicitly, so the auto-name length landmine
  # (CloudFormation's {stack}-{logicalid}-{random} suffixes) does not apply.
  # ---------------------------------------------------------------------------

  UserPool:
    Type: AWS::Cognito::UserPool
    Condition: DeployServer
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        # Invitation-only. Sign-up from the SPA is not offered.
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          # Days an admin-set temporary password stays usable.
          TemporaryPasswordValidityDays: 7
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: DeployServer
    Properties:
      ClientName: !Sub ${AWS::StackName}-app
      UserPoolId: !Ref UserPool
      # A browser client cannot keep a secret.
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      # "Incorrect email or password" for unknown users too.
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      # An ID token lives an hour; the SPA refreshes it silently (rsc-core's
      # getFreshIdToken) for as long as the refresh token lasts.
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  # ---------------------------------------------------------------------------
  # SPA hosting: private S3 bucket + one CloudFront distribution with two
  # origins. The distribution is the whole point -- the browser sees a single
  # origin for both the app and the API, so there is no CORS in production and
  # VITE_API_URL can be relative.
  # ---------------------------------------------------------------------------

  AppBucket:
    Type: AWS::S3::Bucket
    Condition: DeployServer
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  AppOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: DeployServer
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-app-oac
        Description: Signs CloudFront's reads of the SPA bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  AppBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: DeployServer
    Properties:
      Bucket: !Ref AppBucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${AppBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${AppDistribution}

  # SPA fallback, done as a viewer-request rewrite rather than the usual
  # distribution-wide CustomErrorResponses 403/404 -> /index.html.
  #
  # CustomErrorResponses are NOT scoped to a cache behaviour: they would also
  # rewrite the API's own 403s and 404s (GET /api/v1/runs/{unknown-id}) into a
  # 200 carrying the HTML shell, which the app's error handling cannot see
  # through. A CloudFront Function IS per-behaviour, so attaching this to the
  # default behaviour only leaves /api/* completely untouched.
  SpaRouterFunction:
    Type: AWS::CloudFront::Function
    Condition: DeployServer
    Properties:
      Name: !Sub ${AWS::StackName}-spa-router
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrite extensionless paths to /index.html for client-side routing
        Runtime: cloudfront-js-2.0
      # Deliberately ES5-only (indexOf/substring, no includes/endsWith) so it is
      # valid under either CloudFront Functions runtime.
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          var last = uri.substring(uri.lastIndexOf('/') + 1);
          if (last.indexOf('.') === -1) {
            request.uri = '/index.html';
          }
          return request;
        }

  AppDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: DeployServer
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub Nimbus (${AWS::StackName}) -- SPA + API
        HttpVersion: http2and3
        DefaultRootObject: index.html
        Origins:
          - Id: spa
            DomainName: !GetAtt AppBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt AppOriginAccessControl.Id
            # Required-but-empty when OAC is in use (it replaces the legacy OAI).
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: server
            # !GetAtt ...FunctionUrl returns "https://<id>.lambda-url.<region>.on.aws/";
            # CloudFront wants the bare host, which is the third slash-separated
            # field of that URL.
            DomainName: !Select [2, !Split ['/', !GetAtt ServerFunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
              # CloudFront's response timeout is also its *inter-packet* timeout
              # on a streaming response: 60s is the maximum without a quota
              # increase, so a run that goes longer than a minute between NDJSON
              # events will have its connection dropped.
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: spa
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed CachingOptimized. Vite emits content-hashed asset names, and
          # index.html is invalidated by `make deploy-frontend`.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRouterFunction.FunctionARN
        CacheBehaviors:
          # The FastAPI routers mount at /api/v1, so this one pattern covers the
          # whole API and the origin receives the path unchanged -- no
          # OriginPath rewriting, no AWS_LWA_REMOVE_BASE_PATH.
          - PathPattern: /api/*
            TargetOriginId: server
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            # Managed CachingDisabled -- an NDJSON run stream is never cacheable.
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # Managed AllViewerExceptHostHeader: forwards every viewer header,
            # cookie and query string, but lets CloudFront set Host to the
            # Function URL's own domain (Lambda rejects a mismatched Host).
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        # No CustomErrorResponses on purpose -- see SpaRouterFunction above.

Outputs:
  TableName:
    Description: DynamoDB table holding run/evaluation history and cloud-eval state (NIMBUS_EVAL_TABLE)
    Value: !Ref EvalTable
  ArtifactBucket:
    Description: >
      S3 bucket this stack's deployable zips are uploaded to (eval-worker/<sha>.zip
      and server/<sha>.zip); `make deploy-backend` looks it up by this name.
    Value: !Ref ArtifactBucket
  EvalWorkerFunctionName:
    Condition: DeployEvalWorker
    Description: >
      Worker Lambda for the cloud evaluation lane. Set this as
      NIMBUS_EVAL_FUNCTION_NAME on the FastAPI server (with
      NIMBUS_EVAL_TABLE=TableName) to enable the cloud lane.
    Value: !Ref EvalWorkerFunction
  EvalWorkerFunctionArn:
    Condition: DeployEvalWorker
    Description: Worker Lambda ARN (for IAM policies that take an ARN, not a name)
    Value: !GetAtt EvalWorkerFunction.Arn
  UserPoolId:
    Condition: DeployServer
    Description: Cognito user pool the deployed server verifies bearer tokens against (`make create-user` reads this)
    Value: !Ref UserPool
  UserPoolClientId:
    Condition: DeployServer
    Description: The pool's app client id -- the SPA signs in with it (published by GET /api/v1/health)
    Value: !Ref UserPoolClient
  ServerFunctionUrl:
    Condition: DeployServer
    Description: >
      Direct Lambda Function URL for the FastAPI server. AuthType NONE, but
      the server itself requires a bearer token from UserPoolId on every route
      except /health. The supported front door is AppUrl; this is here for
      curl-level debugging and for pointing a local vite at the deployed
      server (which also needs ServerCorsOrigins set).
    Value: !GetAtt ServerFunctionUrl.FunctionUrl
  AppUrl:
    Condition: DeployServer
    Description: The deployment's one public URL -- SPA at /, API at /api/v1.
    Value: !Sub https://${AppDistribution.DomainName}
  AppBucket:
    Condition: DeployServer
    Description: S3 bucket the built SPA is synced into (private; read only via CloudFront OAC)
    Value: !Ref AppBucket
  AppDistributionId:
    Condition: DeployServer
    Description: CloudFront distribution id (for `aws cloudfront create-invalidation`)
    Value: !Ref AppDistribution
